plugins {
 id 'java-library'
 id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
 version = neo_version
 runs { client { client() }; server { server(); programArgument '--nogui' } }
 mods { "${mod_id}" { sourceSet sourceSets.main } }
}
repositories {
 maven { url = 'https://maven.blamejared.com' }
 maven { url = 'https://maven.latvian.dev/releases' }
 maven { url = 'https://maven.shedaniel.me' }
}
dependencies {
 compileOnly "mezz.jei:jei-1.21.1-common-api:19.21.0.247"
 compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.21.0.247"
 compileOnly "dev.latvian.mods:kubejs-neoforge:2101.7.2-build.369"
}
tasks.named('processResources', ProcessResources).configure {
 def props = project.properties.findAll { k, v -> k.startsWith('mod_') || k.startsWith('minecraft_') || k.startsWith('loader_') || k.startsWith('neo_') }
 inputs.properties props
 filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand props }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-Xmaxerrs', '1000'] }
